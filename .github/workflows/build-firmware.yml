name: Build OpenWrt Firmware

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt version (leave empty to auto-detect latest)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve version and check if already released
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/openwrt/openwrt/releases/latest \
              | jq -r '.tag_name' | sed 's/^v//')
          fi

          if [ -z "$VERSION" ]; then
            echo "Failed to determine OpenWrt version"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            || echo "404")

          # On scheduled runs, skip if the release already exists.
          # On manual runs, always build (allows rebuilding/updating an existing release).
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HTTP" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Scheduled run: release v${VERSION} already exists, skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            [ "$HTTP" = "200" ] \
              && echo "Manual run: will rebuild existing release v${VERSION}" \
              || echo "No existing release for v${VERSION}, will build"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        fwmode: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Build vanilla firmware (fwmode=${{ matrix.fwmode }})
        run: |
          mkdir -p bin && chmod 777 bin
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e VERSION=${{ needs.check.outputs.version }} \
            -e FWMODE=${{ matrix.fwmode }} \
            ghcr.io/openwrt/buildbot/buildworker-v3.8.0:v9 \
            bash build-openwrt-vanilla.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mr7500-vanilla-fwmode${{ matrix.fwmode }}
          path: bin/${{ needs.check.outputs.version }}/fwmode${{ matrix.fwmode }}/*
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: mr7500-vanilla-fwmode*
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la bin/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          body: |
            Automated build of OpenWrt ${{ needs.check.outputs.version }} for the Linksys MR7500.

            Three variants are built per release, one per ath11k firmware memory mode.
            Both the AHB-attached 2.4/5 GHz radios and the PCIe QCN9074 6 GHz radio are
            pinned to the same mode so each artifact has a coherent RAM profile:

            | fwmode | Profile  | Peers / vdevs per radio  | Notes                                              |
            |--------|----------|--------------------------|----------------------------------------------------|
            | 0      | ~1 GB    | 512 / 17                 | ath11k driver default; ~85 MB carveout on QCN9074  |
            | 1      | 512 MB   | 128 / 8                  | matches MR7500 RAM; recommended                    |
            | 2      | 256 MB   | 128 / 8                  | coldboot calibration disabled; experimental        |

            Each variant ships both a `*-fwmodeN-squashfs-factory.bin` (fresh install via
            U-Boot/TFTP) and a `*-fwmodeN-squashfs-sysupgrade.bin` (sysupgrade from a
            running OpenWrt).

            The AQR114C PHY firmware is baked into the base squashfs so WAN works on first boot.
            See the [README](https://github.com/${{ github.repository }}#4-flash-via-u-boottftp) for flashing instructions.
          files: bin/*
          fail_on_unmatched_files: true
