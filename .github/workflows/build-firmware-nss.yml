name: Build OpenWrt NSS Firmware

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Specific commit SHA to build (leave empty for HEAD of 25.12-nss)'
        required: false
        default: ''
      force:
        description: 'Force rebuild even if release already exists'
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      short_sha: ${{ steps.head.outputs.short_sha }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Resolve SHA
        id: head
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            SHA="${{ inputs.sha }}"
            echo "Using specified SHA: $SHA"
          else
            SHA=$(curl -sf \
              https://api.github.com/repos/qosmio/openwrt-ipq/commits/25.12-nss \
              | jq -r '.sha')
            echo "Resolved HEAD SHA: $SHA"
          fi

          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "Failed to resolve SHA"
            exit 1
          fi

          SHORT_SHA="${SHA:0:7}"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Short SHA: $SHORT_SHA"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="25.12-nss-${{ steps.head.outputs.short_sha }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
          fi

          if [ "$RELEASE_EXISTS" = "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Scheduled run: release $TAG already exists, skipping"
          elif [ "$RELEASE_EXISTS" = "true" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists, skipping (use force=true to rebuild)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            [ "$RELEASE_EXISTS" = "true" ] \
              && echo "Force rebuild of existing release $TAG" \
              || echo "No release for $TAG, will build"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        fwmode: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Build NSS firmware (fwmode=${{ matrix.fwmode }})
        run: |
          mkdir -p bin && chmod 777 bin
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e BUILD_SHA=${{ needs.check.outputs.sha }} \
            -e FWMODE=${{ matrix.fwmode }} \
            ghcr.io/openwrt/buildbot/buildworker-v3.8.0:v9 \
            bash build-openwrt-nss.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mr7500-nss-fwmode${{ matrix.fwmode }}
          path: bin/fwmode${{ matrix.fwmode }}/*
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: mr7500-nss-fwmode*
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la bin/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 25.12-nss-${{ needs.check.outputs.short_sha }}
          name: 25.12-nss-${{ needs.check.outputs.short_sha }}
          body: |
            Automated NSS build from [qosmio/openwrt-ipq](https://github.com/qosmio/openwrt-ipq) branch `25.12-nss`.

            Three variants are built per release, one per ath11k firmware memory mode.
            Both the AHB-attached 2.4/5 GHz radios and the PCIe QCN9074 6 GHz radio are
            pinned to the same mode so each artifact has a coherent RAM profile:

            | fwmode | Profile  | Peers / vdevs per radio  | Notes                                              |
            |--------|----------|--------------------------|----------------------------------------------------|
            | 0      | ~1 GB    | 512 / 17                 | ath11k driver default; ~85 MB carveout on QCN9074  |
            | 1      | 512 MB   | 128 / 8                  | matches MR7500 RAM; recommended                    |
            | 2      | 256 MB   | 128 / 8                  | coldboot calibration disabled; experimental        |

            Each variant ships both a `*-fwmodeN-squashfs-factory.bin` (fresh install via
            U-Boot/TFTP) and a `*-fwmodeN-squashfs-sysupgrade.bin` (sysupgrade from a
            running OpenWrt).

            The AQR114C PHY firmware is baked into the base squashfs so WAN works on first boot.
            See the [README](https://github.com/${{ github.repository }}#4-flash-via-u-boottftp) for flashing instructions.

            Source SHA: ${{ needs.check.outputs.sha }}
          files: bin/*
          fail_on_unmatched_files: true
